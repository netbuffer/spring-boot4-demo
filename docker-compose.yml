services:
  spring-boot4-demo:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: spring-boot4-demo
    container_name: spring-boot4-demo
    image: javawiki/spring-boot4-demo:1.0.0
    ports:
      - "8080:8080"
    restart: "always"
    healthcheck:
      test: "curl -f http://localhost:8080/actuator/health || exit 1"
      start_period: 60s
      interval: 30s
      timeout: 60s
      retries: 6
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: dev
      MY_ENV_VAR1: spring-boot4-demo-value
      JAVA_OPTS: -Dinfo.tags.environment=dev
